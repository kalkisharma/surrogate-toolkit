<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Surrogate Modeling Toolkit — build fast surrogate models from analytical or test data.">
  <title>Surrogate Modeling Toolkit</title>

  <!-- Apply theme before CSS renders to prevent flash.
       On version change, reset to light mode default so upgrades always
       start clean rather than inheriting a stale dark preference. -->
  <script>
    (function () {
      var currentVer = "0.9.0";
      if (localStorage.getItem("app_version") !== currentVer) {
        localStorage.removeItem("theme");
        localStorage.setItem("app_version", currentVer);
      }
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <!-- Preconnect for Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheets — ?v= busts browser cache on version bumps -->
  <link rel="stylesheet" href="/static/css/variables.css?v=0.9.0">
  <link rel="stylesheet" href="/static/css/main.css?v=0.9.0">
  <link rel="stylesheet" href="/static/css/notifications.css?v=0.9.0">
  <link rel="stylesheet" href="/static/css/loading.css?v=0.9.0">
  <link rel="stylesheet" href="/static/css/learning_mode.css?v=0.9.0">
</head>
<body>

  <!-- Global header — always visible; replaces old #learning-status-bar -->
  <header id="global-header" role="banner" aria-label="Application header">
    <div class="global-header__brand">
      <span class="global-header__name">Surrogate Toolkit</span>
      <span class="global-header__version">v0.9.0</span>
    </div>
    <nav class="global-header__controls" aria-label="Session settings">
      <div class="global-header__control-group">
        <span class="global-header__control-label">Level</span>
        <select id="level-select" class="global-header__select" aria-label="Experience level">
          <option value="beginner" selected>Beginner</option>
          <option value="intermediate" disabled>Intermediate (Phase 3)</option>
          <option value="expert" disabled>Expert (Phase 3)</option>
        </select>
      </div>
      <div class="global-header__control-group">
        <span class="global-header__control-label">Class</span>
        <select id="classification-select" class="global-header__select" aria-label="Data classification">
          <option value="Unclassified" selected>Unclassified</option>
          <option value="CUI">CUI</option>
          <option value="ITAR">ITAR</option>
          <option value="EAR">EAR</option>
        </select>
      </div>
      <div class="global-header__control-group">
        <span class="global-header__control-label">Cores</span>
        <input id="cores-input" type="number" class="global-header__input"
               min="1" value="1" aria-label="Processor count">
      </div>
      <input type="file" id="header-add-file-input" accept=".csv" style="display:none" aria-label="Load additional CSV">
      <button id="header-load-file-btn" class="global-header__btn hidden" aria-label="Load another CSV file" title="Load another CSV file">+ Load File</button>
      <button id="clear-session-btn" class="global-header__btn" aria-label="Clear session" title="Clear all loaded datasets and return to upload screen">✕ Clear</button>
      <button id="theme-toggle" class="global-header__btn" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
      <button id="learning-toggle" class="global-header__btn global-header__btn--learning" aria-label="Toggle learning mode" aria-pressed="false">📚 Learning</button>
    </nav>
  </header>

  <!-- SPA root — all views are rendered here by the JavaScript router -->
  <main id="app" role="main"></main>

  <!-- Notification container — outside #app so toasts overlay everything -->
  <div id="notification-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Plotly (blocking, must load before any module that uses charts.js) -->
  <script src="/static/vendor/plotly.min.js"></script>

  <!-- App entry point — ?v= busts browser cache on version bumps -->
  <script type="module" src="/static/js/main.js?v=0.9.0"></script>

</body>
</html>
